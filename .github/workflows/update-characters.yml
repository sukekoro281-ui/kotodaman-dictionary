name: Update Kotodaman characters
on:
  schedule:
    # Twice a day, Japan time 09:17 and 21:17
    - cron: '17 0,12 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests beautifulsoup4
      - run: python scripts/update_characters.py
      - name: Commit verified additions
        run: |
          if git diff --quiet -- characters-auto.json; then
            echo 'No changes'; exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add characters-auto.json
          git commit -m 'Update verified new Kotodaman characters'
          git push
